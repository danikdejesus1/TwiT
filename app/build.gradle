// TwiT 1.0 — Creado por DanikDeJesus
plugins { id 'com.android.application' }
android {
    namespace 'tv.brisa.app'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'tv.twit.tv'
        minSdk 28
        targetSdk 35
        versionCode 101
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        main {
            assets.srcDirs = []
            java.includes = ['**/MainActivity.java', '**/KickActivity.java', '**/KickLoginPolicy.java', '**/KickSession.java', '**/KickSource.java', '**/KickChat.java', '**/VodSource.java', '**/HomeCatalog.java', '**/ChannelKey.java', '**/TwitchSource.java', '**/TwitchAccount.java', '**/TokenVault.java', '**/AuthPolicy.java', '**/ChatReader.java', '**/ChatLine.java', '**/EmoteChat.java']
        }
        test { java.includes = ['**/TwitchSourceTest.java', '**/ChannelKeyTest.java', '**/KickLoginPolicyTest.java', '**/KickSourceTest.java', '**/HomeCatalogTest.java', '**/AuthPolicyTest.java', '**/ChatLineTest.java'] }
        androidTest { java.srcDirs = [] }
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
