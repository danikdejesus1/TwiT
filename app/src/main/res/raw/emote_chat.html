<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https://static-cdn.jtvnw.net https://cdn.7tv.app https://cdn.betterttv.net https://cdn.frankerfacez.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#f3fff8;font:16px sans-serif}body{padding:14px}header{color:#69ffb4;font-weight:bold;padding-bottom:12px;border-bottom:1px solid #294139}#chat{height:calc(100vh - 64px);overflow:hidden;padding-top:10px}.line{margin:0 0 9px;line-height:1.6;overflow-wrap:anywhere}.name{color:#69ffb4;font-weight:bold}.emote{height:30px;max-width:110px;object-fit:contain;vertical-align:middle}.stack{display:inline-block;position:relative}.overlay{position:absolute;right:0;bottom:0}img{border:0}
</style></head><body><header id="title">CHAT</header><div id="chat"></div><script>
'use strict';let catalog=Object.create(null),history=[];const area=document.getElementById('chat');
function setTitle(s){document.getElementById('title').textContent='CHAT · '+s;}
function setCatalog(data){catalog=Object.assign(Object.create(null),data);render();}
function image(parent,url,word,overlay){let wrap=parent.lastElementChild;if(!overlay||!wrap||wrap.className!=='stack'){wrap=document.createElement('span');wrap.className='stack';parent.appendChild(wrap);}const img=document.createElement('img');img.className='emote'+(overlay?' overlay':'');img.src=url;img.alt=word;img.title=word;img.referrerPolicy='no-referrer';img.onerror=()=>{img.replaceWith(document.createTextNode(word));};wrap.appendChild(img);}
function community(parent,text){text.split(/(\s+)/).forEach(word=>{const e=catalog[word];if(e)image(parent,e.url,word,e.overlay);else parent.appendChild(document.createTextNode(word));});}
function render(messages=history,clear=true){if(clear)area.textContent='';messages.slice(-24).forEach(m=>{const p=document.createElement('div');p.className='line';const name=document.createElement('span');name.className='name';name.textContent=m.name+': ';if(/^#[0-9a-f]{6}$/i.test(m.color))name.style.color=m.color;p.appendChild(name);const chars=Array.from(m.body),ranges=[];
(m.emotes||'').split('/').forEach(spec=>{const at=spec.indexOf(':');if(at<0)return;const id=spec.slice(0,at);if(!/^[a-zA-Z0-9_\-]+$/.test(id))return;spec.slice(at+1).split(',').forEach(range=>{const match=/^(\d+)-(\d+)$/.exec(range);if(match)ranges.push({start:+match[1],end:+match[2],id});});});ranges.sort((a,b)=>a.start-b.start);let pos=0;
ranges.forEach(e=>{if(e.start<pos||e.end<e.start||e.end>=chars.length)return;community(p,chars.slice(pos,e.start).join(''));const word=chars.slice(e.start,e.end+1).join('');image(p,'https://static-cdn.jtvnw.net/emoticons/v2/'+e.id+'/default/dark/2.0',word,false);pos=e.end+1;});community(p,chars.slice(pos).join(''));area.appendChild(p);});while(area.children.length>24)area.firstChild.remove();area.scrollTop=area.scrollHeight;}
function receive(batch){let added=[],changed=false;batch.forEach(m=>{if(m.command==='CLEARMSG'){history=history.filter(x=>x.id!==m.target);changed=true;}else if(m.command==='CLEARCHAT'){history=m.user?history.filter(x=>x.user!==m.user):[];changed=true;}else if(m.command==='PRIVMSG'&&!history.some(x=>m.id&&x.id===m.id)){history.push(m);added.push(m);}});history=history.slice(-24);if(changed)render();else render(added,false);}

</script></body></html>
